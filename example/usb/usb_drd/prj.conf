# FF_LBA64 gates ff.c's GPT protective-MBR branch and is tied to exFAT, so a
# GPT-partitioned U-disk only mounts with this on. VFS_FATFS_INCLUDED is set
# explicitly because its select from USBH_MSC_MENU is WHC-conditional and does
# not fire while this file is applied.
CONFIG_VFS_FATFS_INCLUDED=y
CONFIG_FATFS_SUPPORT_EXFAT=y
