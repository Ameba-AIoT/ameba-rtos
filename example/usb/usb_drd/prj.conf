# USB DRD app switcher: every app whose class is enabled below is built into the image and
# can be run with AT+USBAPP=start|switch,<app>. Only one app runs at a time.
# By default only the MSC device and MSC host apps are built in; uncomment a group to add
# its app(s). Choices (HID type, MSC media) take one value per image.
#
# Note: a select written as "select X if WHC_HOST || WHC_NONE" in Kconfig does not fire
# while this file is applied, so the options such a select would pull in are set here
# explicitly in the group that needs them.

#==============================================================================
# USB core
#==============================================================================
CONFIG_USB_OTG_EN_MENU=y
# DRD: device and host stacks in one image
CONFIG_USB_DRD_EN_MENU=y
# App started at boot, e.g. "usbh_msc"; empty to wait for AT+USBAPP=start
CONFIG_USB_APP_DEFAULT=""

#==============================================================================
# Device apps
#==============================================================================

# ---- usbd_msc: MSC device ----------------------------------------------------
CONFIG_USBD_MSC_MENU=y
# Storage media exposed to the host, one choice. Default SD card (SDIO mode), which
# needs an SD card in the slot; the matching VFS options are set explicitly.
CONFIG_USBD_MSC_SD_CARD=y
CONFIG_VFS_FATFS_INCLUDED=y
CONFIG_VFS_SD_CARD=y
# Other media, enable one instead of the SD card lines above (see usbd_msc/README.md):
# CONFIG_USBD_MSC_FLASH=y
# CONFIG_USBD_MSC_RAM=y
# CONFIG_VFS_RAM=y
# CONFIG_VFS_RAM_PSRAM=y
# CONFIG_VFS_RAM_SIZE_KB=1024

# ---- usbd_cdc_acm: CDC ACM device (virtual COM port, echo) -------------------
# CONFIG_USBD_CDC_ACM_MENU=y

# ---- usbd_vendor: vendor class device, peer of usbh_vendor ------------------
# CONFIG_USBD_VENDOR_MENU=y

# ---- usbd_dfu: DFU device ----------------------------------------------------
# CONFIG_USBD_DFU_MENU=y

# ---- usbd_hid: HID device ----------------------------------------------------
# HID type is a choice for the whole image: the apps here use the mouse.
# CONFIG_USBD_HID_MENU=y
# CONFIG_USBD_HID_MOUSE=y

# ---- usbd_uvc: UVC camera device ---------------------------------------------
# CONFIG_USBD_UVC_MENU=y

# ---- usbd_cdc_ecm / usbd_cdc_ncm: USB Ethernet device (CDC ECM / NCM) -------
# The board answers DHCP on 192.168.45.1; a peer host (PC or usbh_cdc_ecm/ncm) pings it.
# At most ONE network app per image, device or host, ECM or NCM: each defines the lwIP USB
# netif TX hook usb_ethernet_transmit(). Enable the class line and LWIP_USB_ETHERNET_MENU.
# CONFIG_USBD_CDC_ECM_MENU=y
# CONFIG_USBD_CDC_NCM_MENU=y
# CONFIG_LWIP_USB_ETHERNET_MENU=y

# ---- usbd_uac: UAC speaker (and microphone with UAC 2.0) device ---------------
# The UAC version is a choice for the whole image, shared with the UAC composites below.
# CONFIG_USBD_UAC_MENU=y
# CONFIG_USBD_UAC1_MENU=y

# ---- Composite devices -------------------------------------------------------
# Built in when composite and every class they combine are enabled:
#   usbd_composite_cdc_acm_hid: needs USBD_CDC_ACM_MENU + USBD_HID_MENU (mouse)
#   usbd_composite_cdc_acm_msc: needs USBD_CDC_ACM_MENU + USBD_MSC_MENU
#   usbd_composite_cdc_acm_uac: needs USBD_CDC_ACM_MENU + USBD_UAC_MENU
#   usbd_composite_hid_uac:     needs USBD_HID_MENU with CONFIG_USBD_HID_VENDOR=y instead of
#                               the mouse (so no usbd_hid / cdc_acm_hid) + USBD_UAC_MENU,
#                               UAC 2.0 (CONFIG_USBD_UAC2_MENU=y) as in its standalone prj.conf
# CONFIG_USBD_COMPOSITE_MENU=y

#==============================================================================
# Host apps
#==============================================================================

# ---- usbh_msc: MSC host (U-disk / board running usbd_msc) --------------------
CONFIG_USBH_MSC_MENU=y
# The FATFS that mounts the U-disk; its select from USBH_MSC_MENU is WHC-conditional
CONFIG_VFS_FATFS_INCLUDED=y
# FF_LBA64 gates ff.c's GPT protective-MBR branch and is tied to exFAT, so a
# GPT-partitioned or exFAT U-disk only mounts with this on
CONFIG_FATFS_SUPPORT_EXFAT=y

# ---- usbh_cdc_acm: CDC ACM host, peer of usbd_cdc_acm ------------------------
# Left out while the 4G dongle option of the 4G composite below is on.
# CONFIG_USBH_CDC_ACM_MENU=y

# ---- usbh_vendor: vendor class host, peer of usbd_vendor --------------------
# CONFIG_USBH_VENDOR_MENU=y

# ---- usbh_dfu: DFU host, peer of usbd_dfu ------------------------------------
# CONFIG_USBH_DFU_MENU=y

# ---- usbh_cdc_ecm / usbh_cdc_ncm: USB Ethernet host (dongle or usbd_cdc_ecm/ncm)
# The board gets its IP by DHCP from the dongle. ECM Ethernet (not bridge) mode.
# At most ONE network app per image, see the device network group above: the ECM lines
# here, the 4G composite and the Wi-Fi bridge below exclude each other.
# CONFIG_USBH_CDC_ECM_MENU=y
# CONFIG_USBH_ECM_ETHERNET_MENU=y
# CONFIG_USBH_CDC_NCM_MENU=y
# CONFIG_LWIP_USB_ETHERNET_MENU=y

# ---- usbh_composite_cdc_acm_ecm: 4G LTE dongle host (ACM AT port + ECM data) ---
# Dials the dongle over its AT port, then gets the IP over ECM. A network app: it
# replaces usbh_cdc_ecm (same ECM lines) and, through the 4G dongle option, usbh_cdc_acm.
# Its AT command: AT+USBHACMECM.
# CONFIG_USBH_CDC_ACM_MENU=y
# CONFIG_USBH_CDC_ACM_4G_DONGLE_MENU=y
# CONFIG_USBH_CDC_ECM_MENU=y
# CONFIG_USBH_ECM_ETHERNET_MENU=y
# CONFIG_LWIP_USB_ETHERNET_MENU=y

# ---- usbh_wifi_bridge: ECM dongle bridged to the Wi-Fi STA ---------------------
# ECM bridge mode, a choice of the ECM host class: replaces usbh_cdc_ecm and the 4G
# composite. Connect the Wi-Fi STA first (AT+WLCONN). SUPPORT_USBH_ECM_BRIDGE SoCs only.
# CONFIG_USBH_CDC_ECM_MENU=y
# CONFIG_USBH_ECM_ETHERNET_BRIDGE_MENU=y
# CONFIG_LWIP_USB_ETHERNET_MENU=y
# CONFIG_LWIP_USB_ETHERNET_BRIDGE_MENU=y

# ---- usbh_hid: HID host (e.g. headset media keys) ---------------------------
# CONFIG_USBH_HID_MENU=y

# ---- usbh_uac: UAC host (USB headset / speaker) ------------------------------
# CONFIG_USBH_UAC_MENU=y

# ---- usbh_uvc: UVC host (USB camera) -----------------------------------------
# CONFIG_USBH_UVC_MENU=y

# ---- Host composites ---------------------------------------------------------
# Built in when every class they combine is enabled:
#   usbh_composite_hid_uac: needs USBH_HID_MENU + USBH_UAC_MENU
#   usbh_composite_uvc_uac: needs USBH_UVC_MENU + USBH_UAC_MENU
