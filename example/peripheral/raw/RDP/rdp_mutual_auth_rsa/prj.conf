CONFIG_TRUSTZONE=y
CONFIG_TRUSTZONE_MBEDTLS=y
CONFIG_IMG1_SRAM=y
# Reduce TLS record buffers: IN 4096 (enough for RSA handshake + app data), OUT 2048
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN_MENU=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN_MENU=2048
# Enable RSA client key service in image3 (required by this example)
CONFIG_IMG3_RSA_CLIENT_SERVICE=y
# Limit TZ_S_SIZE to 64 KB (RSA image3 static+dynamic fits within 64 KB)
CONFIG_TZ_S_SIZE=64
