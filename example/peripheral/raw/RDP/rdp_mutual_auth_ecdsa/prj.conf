CONFIG_TRUSTZONE=y
CONFIG_TRUSTZONE_MBEDTLS=y
CONFIG_IMG1_SRAM=y
# TLS record buffers: IN 4096 sufficient for ECDSA handshake + app data, OUT 2048
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN_MENU=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN_MENU=2048
# Enable ECDSA client key service in image3 (required by this example)
CONFIG_IMG3_ECDSA_CLIENT_SERVICE=y
